name: Hotspot Ledger · Collect, check and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: read
concurrency:
  group: hotspotledger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Select source refresh
        id: mode
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/current.json')
          ready = path.exists() and json.loads(path.read_text()).get('status') == 'ready'
          collect = os.environ['EVENT'] != 'pull_request' and (not ready or os.environ['EVENT'] in ('schedule', 'workflow_dispatch'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'collect={str(collect).lower()}\n')
          PY
      - name: Collect authenticated eBird source
        if: steps.mode.outputs.collect == 'true'
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          if [ -z "$EBIRD_API_KEY" ]; then
            python3 - <<'PYCODE'
          import json
          from pathlib import Path
          state = json.loads(Path('data/current.json').read_text())
          if state.get('status') == 'ready':
              raise SystemExit('EBIRD_API_KEY is missing; retaining the last successful deployment.')
          print('EBIRD_API_KEY is not configured; publishing the explicit awaiting-source state and local file workflow.')
          PYCODE
          else
            python3 scripts/collect.py
          fi
      - name: Test models, parsers, validation and immutable archives
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
      - name: Build saved data offline
        run: python3 scripts/build.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check complete desktop and mobile flows
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Commit validated derived snapshots
        if: steps.mode.outputs.collect == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          if [ -d archive ]; then git add archive; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: preserve validated eBird comparison capture'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: browser-tool-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
